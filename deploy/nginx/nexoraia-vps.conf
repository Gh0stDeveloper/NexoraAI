upstream nexora_ai_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name ghostnexoraai.duckdns.org;

  server_tokens off;
  client_max_body_size 100M;

  location / {
    proxy_pass http://nexora_ai_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name apighostnexoraai.duckdns.org;

  server_tokens off;
  client_max_body_size 100M;

  location = / {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"ok":true,"service":"Ghost Nexora AI API"}';
  }

  location /api/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "https://ghostnexoraai.duckdns.org" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Nexora-Client" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      return 204;
    }

    proxy_pass http://nexora_ai_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;

    add_header Access-Control-Allow-Origin "https://ghostnexoraai.duckdns.org" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary "Origin" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /openapi.json {
    proxy_pass http://nexora_ai_app/openapi.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin "https://ghostnexoraai.duckdns.org" always;
    add_header Vary "Origin" always;
  }

  location / {
    return 404;
  }
}
