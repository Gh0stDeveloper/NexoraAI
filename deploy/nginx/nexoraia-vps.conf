upstream nexora_ai_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

limit_req_zone $binary_remote_addr zone=nexora_api:10m rate=80r/m;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name ghostnexoraai.duckdns.org;

  server_tokens off;
  client_max_body_size 4M;

  location = /downloads/NexoraAI-latest.apk {
    alias /opt/nexora-ai/releases/NexoraAI-latest.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location /downloads/ {
    alias /opt/nexora-ai/releases/;
    autoindex off;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=300" always;
  }

  location / {
    proxy_pass http://nexora_ai_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name apighostnexoraai.duckdns.org;

  server_tokens off;
  client_max_body_size 40M;

  location = / {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"ok":true,"service":"Ghost Nexora AI API"}';
  }

  # El token de descarga viaja en la URL temporal; no debe terminar en access.log.
  location ~ ^/api/mobile/builds/[0-9a-fA-F-]+/download$ {
    access_log off;
    limit_req zone=nexora_api burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://nexora_ai_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_buffering off;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /api/ {
    limit_req zone=nexora_api burst=20 nodelay;
    limit_req_status 429;
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "https://ghostnexoraai.duckdns.org" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Nexora-Client, X-Nexora-Version, X-Nexora-Request-Token" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      return 204;
    }

    proxy_pass http://nexora_ai_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;

    add_header Access-Control-Allow-Origin "https://ghostnexoraai.duckdns.org" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary "Origin" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  error_page 429 = @nexora_rate_limited;
  location @nexora_rate_limited {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "https://ghostnexoraai.duckdns.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 429 '{"ok":false,"error":"Demasiadas solicitudes. Inténtalo de nuevo en un minuto."}';
  }

  location = /openapi.json {
    proxy_pass http://nexora_ai_app/openapi.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin "https://ghostnexoraai.duckdns.org" always;
    add_header Vary "Origin" always;
  }

  location / {
    return 404;
  }
}
