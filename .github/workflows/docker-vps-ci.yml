name: Docker VPS CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Validate Docker and VPS scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production env for Compose validation
        run: cp .env.vps.example .env.production

      - name: Validate shell scripts
        run: find deploy/scripts -type f -name "*.sh" -print0 | xargs -0 -I{} bash -n {}

      - name: CI preflight
        run: node scripts/ci-preflight.mjs

      - name: Validate Docker Compose VPS config
        run: docker compose -f docker-compose.vps.yml config

      - name: Build Docker image
        run: docker build -t nexora-ai:${{ github.sha }} .
