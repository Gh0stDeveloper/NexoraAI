name: Docker VPS CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Validate Docker, Nginx and VPS scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production env for Compose validation
        run: cp .env.vps.example .env.production

      - name: Validate shell scripts
        run: find deploy/scripts mail-service -type f -name "*.sh" -print0 | xargs -0 -I{} bash -n {}

      - name: Validate Nexora Mail gateway syntax
        run: python3 -m py_compile mail-service/gateway.py

      - name: Test transient VPS startup failures
        run: bash scripts/vps-healthcheck.test.sh

      - name: Test VPS update and automatic rollback
        run: bash scripts/vps-update-contract.test.sh

      - name: Validate sandbox runner syntax
        run: node --check sandbox/server.mjs

      - name: CI preflight
        run: node scripts/ci-preflight.mjs

      - name: Validate Docker Compose VPS config
        run: docker compose --env-file .env.production --profile sandbox -f docker-compose.vps.yml config

      - name: Validate Nginx production config
        run: |
          docker run --rm \
            -v "$PWD/deploy/nginx/nexoraia-vps.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Build Docker image
        run: docker build -t nexora-ai:${{ github.sha }} .

      - name: Build Nexora Mail image
        run: docker build -t nexora-ai-mailer:${{ github.sha }} mail-service

      - name: Smoke test Nexora Mail runtime
        run: |
          docker compose --env-file .env.production -f docker-compose.vps.yml up -d --build mailer
          for attempt in $(seq 1 40); do
            if docker compose --env-file .env.production -f docker-compose.vps.yml \
              exec -T mailer python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8025/health', timeout=3).read()"; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose --env-file .env.production -f docker-compose.vps.yml logs --no-color mailer
              exit 1
            fi
            sleep 2
          done
          docker compose --env-file .env.production -f docker-compose.vps.yml \
            exec -T mailer sh -c 'test -s /var/lib/nexora-mail/nexora.private && test -s /var/lib/nexora-mail/nexora.txt'
          docker compose --env-file .env.production -f docker-compose.vps.yml down --remove-orphans

      - name: Build sandbox runner image
        run: docker build -t nexora-ai-sandbox:${{ github.sha }} sandbox

      - name: Build isolated Android worker image
        run: docker build -f build-worker/Dockerfile -t nexora-ai-build-worker:${{ github.sha }} .