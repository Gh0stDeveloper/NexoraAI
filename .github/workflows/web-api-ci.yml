name: Web API CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Build and validate Next.js API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nexora_ai_ci
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_ai_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      NEXT_PUBLIC_SITE_URL: https://ghostnexoraai.duckdns.org
      NEXT_PUBLIC_API_URL: https://apighostnexoraai.duckdns.org
      MOBILE_PRODUCTION_API_URL: https://apighostnexoraai.duckdns.org/
      AI_PROVIDER: ollama
      DATABASE_URL: postgresql://nexora:nexora-ci-password@127.0.0.1:5432/nexora_ai_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: CI preflight
        run: npm run ci:preflight

      - name: Validate mobile API contracts
        run: npm run test:contracts

      - name: Validate durable PostgreSQL jobs
        run: node --no-warnings --experimental-strip-types --test scripts/durable-jobs-db.integration.mjs

      - name: Validate repository structure
        run: npm run validate:repo

      - name: Validate training dataset
        run: npm run dataset:validate

      - name: Static security check
        run: npm run security:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

  android-debug:
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android/GhostNexoraAndroid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify native library in debug APK
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -n "$APK"
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -l "$APK" | grep -q "lib/$ABI/libnexora.so"
          done

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ai-debug-apk
          path: apps/android/GhostNexoraAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
