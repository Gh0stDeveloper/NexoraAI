name: Android CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Compile debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android/GhostNexoraAndroid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify native library in debug APK
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -n "$APK"
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -l "$APK" | grep -q "lib/$ABI/libnexora.so"
          done

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ai-debug-apk
          path: apps/android/GhostNexoraAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Compile minified release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android/GhostNexoraAndroid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report unsigned release validation
        if: steps.signing.outputs.enabled != 'true'
        run: echo "Signing secrets are unavailable; CI will compile an unsigned minified release APK."

      - name: Decode release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build unsigned minified release APK
        if: steps.signing.outputs.enabled != 'true'
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build signed minified release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify native library in release APK
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -l "$APK" | grep -q "lib/$ABI/libnexora.so"
          done

      - name: Verify official V1 V2 V3 signature
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          VERIFY="$("$APKSIGNER" verify --min-sdk-version 23 --verbose "$APK")"
          grep -Eiq 'Verified using v1 scheme.*: true' <<< "$VERIFY"
          grep -Eiq 'Verified using v2 scheme.*: true' <<< "$VERIFY"
          grep -Eiq 'Verified using v3 scheme.*: true' <<< "$VERIFY"

      - name: Build and verify safe user application template
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/nexora-user-builds.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass ci-store-password \
            -keypass ci-key-password \
            -alias nexora-user-builds \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=Nexora CI, O=Ghost Developer, C=MX"
          NEXORA_EXTERNAL_APK_SIGNING=true \
            gradle -p ../../../build-worker/template \
              assembleRelease --no-daemon --stacktrace
          UNSIGNED_APK="$(find ../../../build-worker/template/app/build/outputs/apk/release -name '*-unsigned.apk' | head -n 1)"
          test -n "$UNSIGNED_APK"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ALIGNED_APK="$RUNNER_TEMP/nexora-user-aligned.apk"
          SIGNED_APK="$RUNNER_TEMP/nexora-user-signed.apk"
          test -x "$ZIPALIGN" && test -x "$APKSIGNER"
          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          ANDROID_KEYSTORE_PASSWORD=ci-store-password \
          ANDROID_KEY_PASSWORD=ci-key-password \
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias nexora-user-builds \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"
          VERIFY="$("$APKSIGNER" verify --min-sdk-version 23 --verbose "$SIGNED_APK")"
          printf '%s\n' "$VERIFY"
          grep -Eiq 'Verified using v1 scheme.*: true' <<< "$VERIFY"
          grep -Eiq 'Verified using v2 scheme.*: true' <<< "$VERIFY"
          grep -Eiq 'Verified using v3 scheme.*: true' <<< "$VERIFY"

      - name: Upload release APK artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ai-release-apk
          path: apps/android/GhostNexoraAndroid/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
