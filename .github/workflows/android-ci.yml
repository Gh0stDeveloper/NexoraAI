name: Android CI
on: {push: {branches: [main, "agent/**"], paths: ["apps/android/**", ".github/workflows/android-ci.yml"]}, pull_request: {branches: [main], paths: ["apps/android/**", ".github/workflows/android-ci.yml"]}, workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/android/GhostNexoraAndroid}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.10.2}
      - run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with: {name: nexora-ai-debug-apk, path: apps/android/GhostNexoraAndroid/app/build/outputs/apk/debug/*.apk, if-no-files-found: error}
