name: Linux Compatibility CI

on:
  push:
    branches: [main, "agent/**", "codex/**"]
    paths:
      - "deploy/**"
      - "docker-compose.vps.yml"
      - "Dockerfile"
      - "sandbox/**"
      - ".github/workflows/platform-compatibility.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distro:
    name: ${{ matrix.name }} · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            runner: ubuntu-24.04
            arch: amd64
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            runner: ubuntu-24.04
            arch: amd64
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            runner: ubuntu-24.04
            arch: amd64
          - name: Debian 11
            image: debian:11-slim
            runner: ubuntu-24.04
            arch: amd64
          - name: Debian 12
            image: debian:12-slim
            runner: ubuntu-24.04
            arch: amd64
          - name: Debian 13
            image: debian:13-slim
            runner: ubuntu-24.04
            arch: amd64
          - name: Ubuntu 24.04 ARM64
            image: ubuntu:24.04
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Validate platform and scripts in target distro
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            "${{ matrix.image }}" \
            bash -lc 'bash deploy/scripts/platform-check.sh --ci && find deploy/scripts -name "*.sh" -exec bash -n {} \;'

  compose-architectures:
    name: Container architecture declarations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.vps.example .env.production
      - name: Validate Compose with sandbox profile
        run: docker compose --profile sandbox -f docker-compose.vps.yml config
      - name: Verify container image platforms
        run: |
          for IMAGE in node:22-alpine python:3.12-alpine bash:5.2 pgvector/pgvector:pg16 ollama/ollama:latest; do
            SAFE_NAME="${IMAGE//[:\/]/-}"
            docker buildx imagetools inspect "$IMAGE" > "/tmp/$SAFE_NAME-manifest.txt"
            grep -q 'linux/amd64' "/tmp/$SAFE_NAME-manifest.txt"
            grep -q 'linux/arm64' "/tmp/$SAFE_NAME-manifest.txt"
          done
