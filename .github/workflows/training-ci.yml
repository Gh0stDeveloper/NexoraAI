name: Training Dataset CI

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "training/**"
      - ".github/workflows/training-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "training/**"
      - ".github/workflows/training-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataset:
    name: Validate training dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile dataset validator
        run: python -m py_compile training/scripts/validate_dataset.py

      - name: Validate sample dataset
        run: python training/scripts/validate_dataset.py training/datasets/nexora-devsec-sample.jsonl
